<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计稿 · 画语 Canvas</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/design.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"></head>
<body class="design-body">
  <header class="design-header"><a href="/" class="design-back">← 创作空间</a><div><strong>设计稿</strong><span id="designStatus">正在加载</span></div><div class="design-header-actions"><button id="reviewContent" class="button outlined" hidden>核对内容</button><button id="saveDesign" class="button dark" disabled>保存并预览</button><button id="snapshotDesign" class="button outlined" disabled>保存版本</button></div></header>
  <div id="designSourceNotice" class="design-source-notice" hidden><img id="designSourceThumbnail" alt="从创作空间带入的图片"><p id="designSourceText"></p></div>
  <main class="design-main">
    <aside class="design-sidebar">
      <section class="design-ai"><h2>AI 设计助手</h2><p class="design-help">按画布设置生成独立文字、图片和色块。已有稿件可继续描述局部修改。</p><form id="designAiForm"><label>设计要求<textarea id="designAiPrompt" maxlength="12000" placeholder="例如：结合菜单明细和 Logo 排版；或只把某项价格改成 78，保留其他设计。" required></textarea></label><fieldset class="design-ai-references"><legend id="designAiReferenceLabel">本轮参考图 · 0 / 8</legend><div id="designAiReferences"></div></fieldset><div class="design-ai-actions"><button id="designAiSubmit" class="button dark" type="submit" disabled>AI 生成可编辑稿</button><button id="designAiStop" class="button outlined" type="button" hidden>停止</button></div></form><p id="designAiStatus" class="design-help" role="status"></p><div id="designAiReply" class="design-ai-reply" hidden></div></section>
      <section><h2>画布设置</h2><label>设计稿名称<input id="designTitle" maxlength="100" value="未命名设计稿"></label><div class="design-fields"><label>宽度<input id="pageWidth" type="number" min="1" max="20000" step="0.1" value="1200"></label><label>高度<input id="pageHeight" type="number" min="1" max="20000" step="0.1" value="1600"></label><label>单位<select id="pageUnit"><option value="px">像素 px</option><option value="mm">毫米 mm</option></select></label><label>背景色<input id="pageBackground" type="color" value="#ffffff"></label></div><button id="createDesign" class="button dark">创建设计稿</button></section>
      <section id="contentSection" hidden><h2>内容核对</h2><p class="design-help">内容修改会同步到绑定文字。待核对项确认后才能下载。</p><div id="designContent"></div></section>
      <section id="objectsSection" hidden><div class="design-section-heading"><h2>设计对象</h2><button id="deleteObject" class="button subtle small" disabled>删除选中</button></div><div class="design-add"><button id="addText" class="button outlined small">＋ 文字</button><button id="addShape" class="button outlined small">＋ 色块</button></div><label>当前会话素材<select id="assetSelect" aria-label="选择素材"></select></label><button id="addImage" class="button outlined small">＋ 插入图片或 Logo</button><div id="objectList" class="design-object-list" aria-label="设计对象列表"></div><div id="objectProperties"></div></section>
      <section id="versionsSection" hidden><h2>设计版本</h2><select id="designVersions" aria-label="选择设计版本"></select><button id="restoreDesign" class="button outlined small" disabled>恢复所选版本</button></section>
    </aside>
    <section class="design-workspace" aria-label="设计稿预览"><div class="design-preview-heading"><span id="designPageLabel">自定义画布</span><span id="dirtyPreview" hidden>有修改待保存</span></div><div class="design-preview-stage"><div id="designEmpty" class="design-empty"><span>✳</span><h1>从一份设计稿开始</h1><p>描述需求，让 AI 生成可编辑设计稿。<br>也可以设置尺寸后手动添加文字、图片和 Logo。</p></div><img id="designPreview" alt="当前设计稿预览" hidden></div><div id="designIssues" class="design-issues" aria-live="polite"></div></section>
    <aside class="design-download"><h2>下载</h2><label>文件格式<select id="designFormat"><option value="png">PNG 图片 · RGB</option><option value="jpeg">JPG 图片 · RGB</option><option value="pdf-rgb">PDF · RGB</option><option value="pdf-cmyk">PDF · CMYK</option></select></label><label id="scaleField">图片缩放<select id="designScale"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label><p id="exportInfo" class="design-help">文字与图形按设计稿排版输出。</p><p id="profileInfo" class="design-help" hidden></p><button id="downloadDesign" class="button dark" disabled>下载文件</button><p class="design-help">当前编辑单页。PDF 保留独立文字与图形；原始位图保持原有清晰度。</p></aside>
  </main><div id="designMessage" class="design-message" role="status" hidden></div>
  <script type="module" src="/design.js"></script>
</body></html>
